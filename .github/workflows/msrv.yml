name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build
        run: cargo +1.85.0 build --workspace --locked
      - name: Test
        run: cargo +1.85.0 test --workspace --locked
      - name: Build with all features
        run: cargo +1.85.0 build --workspace --all-features --locked
      - name: Test with all features
        run: cargo +1.85.0 test --workspace --all-features --locked
