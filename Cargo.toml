[workspace]
members = [
    "crates/xrtak-core",
    "crates/xrtak-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Goksel Ozgur <gokselozgur5@gmail.com>"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
